<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: "Hiragino Kaku Gothic ProN", sans-serif; }
  .half { width: 50%; float: left; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .green { background: linear-gradient(to bottom, #fffdf9, #e8d8c0); }
  .brown { background: linear-gradient(to bottom, #fffdf9, #e8d8c0); }
  h1 { font-size: 2em; margin-bottom: 0.3em; }
  p { font-style: italic; color: #888; margin: 0; }
  label { font-size: 0.85em; margin-top: 1.5em; color: #999; }
</style>
</head>
<body>
  <div class="half green">
    <h1 style="color: #2d4a2d;">一山一会：50代の山支度</h1>
    <p>信頼できるギアをひとつ選んで山へ行く</p>
    <label>← 深いグリーン</label>
  </div>
  <div class="half brown">
    <h1 style="color: #5c3d1e;">一山一会：50代の山支度</h1>
    <p>信頼できるギアをひとつ選んで山へ行く</p>
    <label>深いブラウン →</label>
  </div>
</body>
</html>
